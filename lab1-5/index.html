<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>A Mad Tea-Party Order Form</title>
    <style>
        table {
            border-collapse: collapse;
        }

        th,
        td {
            border: 1px solid black;
            padding: 6px;
        }
    </style>
</head>
<body>

    <header>
        <h1>A Mad Tea-Party</h1>
    </header>

    <main>

        <section>
            <h2>Tea Party Supplies</h2>

            <table>
                <tr>
                    <th>Item</th>
                    <th>Price</th>
                </tr>
                <tr>
                    <td>Tea Cups with Saucers</td>
                    <td>$35.99</td>
                </tr>
                <tr>
                    <td>Tea Pot</td>
                    <td>$28.99</td>
                </tr>
                <tr>
                    <td>Serving Spoon Set</td>
                    <td>$10.99</td>
                </tr>
                <tr>
                    <td>Butter Dish</td>
                    <td>$12.99</td>
                </tr>
                <tr>
                    <td>Bread Knife</td>
                    <td>$29.99</td>
                </tr>
                <tr>
                    <td>Table Cloth</td>
                    <td>$34.99</td>
                </tr>
            </table>
        </section>

        <section>
            <h3>Order Form</h3>

            <form method="post" action="http://data.rebol.com/cgi-bin/test-cgi.cgi">

                <p>
                    <label for="customername">Customer Name:</label>
                    <input type="text" id="customername" name="customername">
                </p>

                <p>
                    <label for="mailingaddress">Mailing Address:</label>
                    <input type="text" id="mailingaddress" name="mailingaddress">
                </p>

                <p>
                    <label for="city">City:</label>
                    <input type="text" id="city" name="city">
                </p>

                <p>
                    <label for="state">State:</label>
                    <select id="state" name="state">
                        <option value="IL">IL</option>
                        <option value="IN">IN</option>
                        <option value="MI">MI</option>
                        <option value="WI">WI</option>
                    </select>
                </p>

                <p>Choose a shipping option:</p>

                <p>
                    <input type="radio" id="standard" name="shipping" value="standard">
                    <label for="standard">Standard shipping (3-4 days)</label>
                </p>

                <p>
                    <input type="radio" id="rush" name="shipping" value="rush">
                    <label for="rush">Rush shipping (2 days)</label>
                </p>

                <p>
                    <input type="radio" id="overnight" name="shipping" value="overnight">
                    <label for="overnight">Overnight shipping (1 day)</label>
                </p>

                <p>
                    <label for="instructions">Special delivery instructions?</label><br>
                    <textarea id="instructions" name="instructions" cols="30" rows="4"></textarea>
                </p>

                <p>
                    <input type="checkbox" id="mailinglist" name="mailinglist" checked>
                    <label for="mailinglist">E-mail me about future promotions and sales.</label>
                </p>

                <p>
                    <input type="submit" value="Place Order">
                </p>

            </form>
        </section>

    </main>

</body>
</html>
